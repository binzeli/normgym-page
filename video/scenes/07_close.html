<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  #brand { position: absolute; left: 0; right: 0; top: 110px; display: flex; align-items: center; justify-content: center; gap: 36px; }
  #logo { width: 150px; }
  #name { font-family: 'Cinzel', serif; font-weight: 600; font-size: 92px;
    background: linear-gradient(180deg, #3d63a6 0%, #23417a 55%, #142a52 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tagline { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font-size: 44px; color: #222; }
  .accent { color: #c0562b; font-weight: 600; }
  #crew { position: absolute; left: 0; right: 0; top: 380px; text-align: center; }
  #authors { font-size: 40px; }
  #authors sup, #affil sup { font-size: 0.6em; color: var(--muted); }
  #affil { font-size: 28px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  #equal { font-size: 24px; color: var(--muted); margin-top: 6px; font-style: italic; }
  #rule { position: absolute; left: 50%; top: 600px; width: 1100px; height: 2px; background: var(--rule); transform: translateX(-50%); }
  #links { position: absolute; left: 50%; transform: translateX(-50%); top: 670px; display: flex; flex-direction: column; gap: 24px; }
  .link { display: flex; align-items: baseline; gap: 26px; font-size: 38px; }
  .link .k { font-family: 'IBM Plex Mono', monospace; font-weight: 600; width: 190px; color: var(--navy); }
  .link .v.soon { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div id="brand">
  <img id="logo" src="../../static/img/logo.svg">
  <div id="name">NormGym</div>
</div>
<div id="tagline">The first multi-agent testbed for <span class="accent">normative competence</span></div>
<div id="crew">
  <div id="authors">Binze Li<sup>1</sup> · Zihuan Zhang<sup>1</sup> · Seokhyun Baek<sup>1</sup> · Gillian K. Hadfield<sup>*1,2</sup> · Tianmin Shu<sup>*1</sup></div>
  <div id="affil"><sup>1</sup>Johns Hopkins University &nbsp;&nbsp; <sup>2</sup>Vector Institute</div>
  <div id="equal">*Equal advising</div>
</div>
<div id="rule"></div>
<div id="links">
  <div class="link" id="l1"><span class="k">Paper</span><span class="v soon">coming soon</span></div>
  <div class="link" id="l2"><span class="k">Code</span><span class="v soon">coming soon</span></div>
  <div class="link" id="l3"><span class="k">Website</span><span class="v">binzeli.github.io/normgym-page</span></div>
</div>
<script src="common.js"></script>
<script>
window.DURATION = 11;
window.seek = function (t) {
  enter($('#logo'), t, 0.1); enter($('#name'), t, 0.5);
  enter($('#tagline'), t, 1.1);
  enter($('#authors'), t, 2.0); enter($('#affil'), t, 2.5); enter($('#equal'), t, 2.8);
  enter($('#rule'), t, 3.3);
  enter($('#l1'), t, 3.6); enter($('#l2'), t, 4.0); enter($('#l3'), t, 4.4);
};
window.seek(0);
</script>
</body>
</html>
